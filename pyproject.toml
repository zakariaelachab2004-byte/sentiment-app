[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "1.0.0"
description = "Application de détection du sentiment des avis clients."
readme = "README-PAQUET.md"
requires-python = ">=3.11"
authors = [{ name = "Binôme sentiment-app" }]
dependencies = [
    "scikit-learn>=1.5,<1.6",
    "joblib==1.4.*",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "httpx==0.27.*",
    "requests==2.32.*",
    "python-dotenv==1.0.*",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<1.40"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sentiment_app = ["models/*.joblib"]

[tool.setuptools.packages.find]
include = ["sentiment_app", "sentiment_app.models", "api", "ui"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true
